services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: courserep
      POSTGRES_USER: courserep
      POSTGRES_PASSWORD: courserep-local
    ports:
      - "5432:5432"
    volumes:
      - courserep-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courserep -d courserep"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  courserep-postgres:
